[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autovv"
version = "0.1.0"
description = "Vanilla-style MER/MERS maps and texture sets for Minecraft Bedrock Vibrant Visuals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10.0", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autovv = "autovv.__main__:main"

[tool.setuptools.packages.find]
include = ["autovv*"]

[tool.setuptools.package-data]
autovv = ["data/*.json", "data/*.md", "gui/assets/*.svg"]
